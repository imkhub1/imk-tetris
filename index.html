<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>imk-Tetris</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Start Screen -->
    <div id="start-screen" class="start-screen">
      <h1 class="start-title">IMK-TETRIS</h1>
      <div class="hs-section">
        <p class="hs-heading">HIGH SCORES</p>
        <table class="hs-table" id="start-hs-table">
          <thead>
            <tr>
              <th>#</th>
              <th>NAME</th>
              <th>SCORE</th>
              <th>LINES</th>
              <th>COMBO</th>
            </tr>
          </thead>
          <tbody id="start-hs-body"></tbody>
        </table>
      </div>
      <p class="press-enter">PRESS ENTER TO PLAY</p>
      <button class="reset-btn" id="start-reset-btn">Reset Records</button>
    </div>

    <div class="container">

      <!-- Left panel: game info -->
      <aside class="panel panel-left">
        <h1 class="title">IMK-TETRIS</h1>

        <div class="info-block">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="info-block">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="info-block">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="info-block">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>
      </aside>

      <!-- Main board -->
      <main class="board-wrapper">
        <canvas id="board" width="300" height="600"></canvas>

        <!-- Overlay: Game Over -->
        <div id="overlay" class="overlay hidden">
          <p id="overlay-title" class="overlay-title"></p>

          <!-- Name entry (shown when qualifying for top 5) -->
          <div id="name-entry" class="name-entry hidden">
            <p class="name-label">NEW HIGH SCORE!</p>
            <div class="name-input-row">
              <input id="name-input" class="name-input" type="text" maxlength="3" placeholder="AAA" autocomplete="off" />
              <button id="name-save-btn" class="name-save-btn">SAVE</button>
            </div>
          </div>

          <!-- High scores table in overlay -->
          <div id="overlay-hs-section" class="hs-section hidden">
            <p class="hs-heading">HIGH SCORES</p>
            <table class="hs-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>NAME</th>
                  <th>SCORE</th>
                  <th>LINES</th>
                  <th>COMBO</th>
                </tr>
              </thead>
              <tbody id="overlay-hs-body"></tbody>
            </table>
            <button class="reset-btn" id="overlay-reset-btn">Reset Records</button>
          </div>

          <p id="overlay-sub" class="overlay-sub"></p>
        </div>

        <!-- Pause Menu -->
        <div id="pause-menu" class="pause-menu hidden">
          <p class="pause-menu-title">PAUSED</p>

          <div class="pause-menu-buttons">
            <button id="btn-resume" class="theme-btn pause-btn">RESUME</button>
            <button id="btn-restart" class="theme-btn pause-btn">RESTART</button>
          </div>

          <div class="pause-controls">
            <span class="label">CONTROLS</span>
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> Move</li>
              <li><kbd>↑</kbd> / <kbd>X</kbd> Rotate</li>
              <li><kbd>↓</kbd> Soft Drop</li>
              <li><kbd>Space</kbd> Hard Drop</li>
              <li><kbd>P</kbd> Pause</li>
            </ul>
          </div>

          <div class="pause-level-select">
            <span class="label">STARTING LEVEL</span>
            <div class="level-controls">
              <button id="btn-level-dec" class="theme-btn level-btn">-</button>
              <span id="start-level-display" class="level-value">1</span>
              <button id="btn-level-inc" class="theme-btn level-btn">+</button>
            </div>
          </div>
        </div>
      </main>

      <!-- Right panel: next piece + controls -->
      <aside class="panel panel-right">
        <div class="info-block">
          <span class="label">NEXT</span>
          <canvas id="next" width="120" height="120"></canvas>
        </div>

        <div class="skin-selector">
          <span class="label">SKIN</span>
          <div class="skin-btns">
            <button class="skin-btn active" data-skin="retro">Retro</button>
            <button class="skin-btn" data-skin="neon">Neon</button>
            <button class="skin-btn" data-skin="pastel">Pastel</button>
            <button class="skin-btn" data-skin="pixel">Pixel</button>
          </div>
        </div>

        <button id="theme-toggle" class="theme-btn">&#9728; LIGHT</button>
      </aside>

    </div>

    <script src="game.js"></script>
  </body>
</html>
